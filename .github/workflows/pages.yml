# 直接把 repo 根目錄的靜態檔案部署到 GitHub Pages。
# 2026-08-06 改用這個流程：原本的 legacy 建置器從 8/6 起每次都 errored、
# 且錯誤訊息只有籠統的 "Page build failed."、duration=0（瞬間失敗），
# 手動重建也一樣，等於網站更新完全停擺。這個 repo 全是靜態 HTML，
# 不需要 Jekyll，用官方的 upload-pages-artifact + deploy-pages 最單純。
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
