<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>佳能板型 混搭計算機</title>
<style>
  :root {
    --bg: #0f1114; --card: #1a1d23; --ink: #e6e8eb; --sub: #8b93a1; --line: #2c313a;
    --key: #262a32; --keyhi: #313742; --accent: #f5a524; --lcd: #0b1a10; --lcdink: #7dffa0;
    --warn: #ffb547; --warnbg: #2a2110; --ok: #6ee7a0; --bad: #ff7b72;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif; }
  header { background: #08090b; color: var(--accent); padding: 14px 16px; position: sticky; top: 0; z-index: 5; border-bottom: 2px solid var(--accent); }
  header h1 { margin: 0; font-size: 19px; letter-spacing: 1px; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 12px 60px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 6px rgba(0,0,0,.4); }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--accent); }
  h3 { font-size: 15px; margin: 14px 0 6px; color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  label.inl { display: flex; align-items: center; gap: 6px; }
  input[type=number] { width: 110px; font: 600 18px ui-monospace, "Consolas", monospace; padding: 8px; border: 1px solid #1f3a26; border-radius: 8px; background: var(--lcd); color: var(--lcdink); text-align: right; }
  input.small { width: 80px; }
  button { font-size: 15px; padding: 9px 12px; border-radius: 10px; border: 1px solid #3a404b; background: linear-gradient(#2e333c, var(--key)); color: var(--ink); cursor: pointer; min-height: 42px; box-shadow: 0 2px 0 #000; }
  button:active { transform: translateY(1px); box-shadow: none; }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .muted { color: var(--sub); font-size: 14px; }
  .note { background: var(--warnbg); color: var(--warn); border: 1px solid #4a3a14; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { color: var(--sub); font-weight: 600; font-size: 13px; }
  .code { display: inline-block; min-width: 26px; text-align: center; color: #fff; border-radius: 6px; padding: 1px 6px; font-weight: 700; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); }
  .big { font: 700 20px ui-monospace, "Consolas", monospace; color: var(--lcdink); background: var(--lcd); border: 1px solid #1f3a26; border-radius: 8px; padding: 8px 10px; display: inline-block; }
  .bar { display: flex; height: 56px; border: 2px solid #4a515c; border-radius: 6px; overflow: hidden; background: repeating-linear-gradient(45deg, #23272e, #23272e 6px, #1a1d22 6px, #1a1d22 12px); margin: 6px 0 4px; }
  .seg-piece { display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-size: 12px; line-height: 1.2; border-right: 1px solid rgba(0,0,0,.6); overflow: hidden; white-space: nowrap; }
  .seg-piece b { font-size: 14px; }
  .sheet { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; background: #262b33; margin: 2px 4px 2px 0; font-size: 14px; }
  details summary { cursor: pointer; font-weight: 600; padding: 4px 0; color: var(--accent); }
</style>
</head>
<body>
<header><h1>佳能板型 混搭計算機</h1></header>
<main>

<section>
  <h2>板子</h2>
  <div class="row">
    <span>板寬</span>
    <div class="seg" id="wQuick">
      <button data-w="914">3尺 914</button>
      <button data-w="1219">4尺 1219</button>
      <button data-w="1524">5尺 1524</button>
    </div>
  </div>
  <div class="row">
    <label class="inl">自己輸入 <input type="number" id="sheetW" inputmode="decimal" min="1"> mm</label>
    <span class="muted" id="sheetWcm"></span>
  </div>
  <div class="row">
    <span>厚度</span>
    <div class="seg" id="thk">
      <button data-t="all">不限</button>
      <button data-t="1t">1t</button>
      <button data-t="1.2t">1.2t</button>
    </div>
  </div>
  <div class="row">
    <label class="inl">每刀損耗／修邊 <input type="number" id="kerf" class="small" inputmode="decimal" min="0" step="0.5"> mm</label>
  </div>
  <p class="muted">每一條料都會多算一次損耗（例如損耗 2，C槽 112 就當 114 算）。</p>
</section>

<section>
  <h2>功能一：剩料能做什麼</h2>
  <div class="row">
    <label class="inl">剩料寬度 <input type="number" id="leftW" inputmode="decimal" min="0"></label>
    <div class="seg" id="leftUnit">
      <button data-u="cm">cm</button>
      <button data-u="mm">mm</button>
    </div>
  </div>
  <div id="leftOut"></div>
</section>

<section>
  <h2>功能二：整單排料</h2>
  <table id="qtyTable"></table>
  <div class="row"><button class="primary" id="runPack">排料</button><button id="clearQty">清空支數</button></div>
  <div id="packOut"></div>
</section>

<section>
  <details>
    <summary>板型資料（展開寬度可改）</summary>
    <p class="muted">展開寬度＝各邊加總（mm）。改了會記在這支手機上。</p>
    <table id="specTable"></table>
    <div class="row"><button id="resetSpec">恢復預設</button></div>
  </details>
</section>

</main>
<script>
const DEFAULTS = [
  { id: "A", name: "C槽",           t: "1t",   folds: "30+52+30",          w: 112, len: "10尺" },
  { id: "B", name: "連通套件（薄款）", t: "1t",   folds: "30+215+30",         w: 275, len: "2100" },
  { id: "C", name: "連通套件（厚款）", t: "1.2t", folds: "40+215+40",         w: 295, len: "2100" },
  { id: "D", name: "樓梯口套件",      t: "1.2t", folds: "35+305+35（包內尺寸）", w: 375, len: "3050" },
  { id: "E", name: "大連通",          t: "1.2t", folds: "30+88+240+88+30",   w: 476, len: "10尺" },
  { id: "F", name: "扣布",            t: "1t",   folds: "30+40+50+30",       w: 150, len: "10尺" },
];
const COLORS = { A: "#1f6feb", B: "#12855c", C: "#0b5d3f", D: "#c2410c", E: "#7c3aed", F: "#be185d" };
const LS = "sheetmix_v1";

const store = (() => {
  try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; }
})();
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

const state = {
  widths: Object.assign({}, store.widths || {}),
  sheetW: store.sheetW || 1219,
  thk: store.thk || "all",
  kerf: store.kerf != null ? store.kerf : 0,
  leftUnit: store.leftUnit || "cm",
  leftW: store.leftW != null ? store.leftW : 19,
  qty: Object.assign({}, store.qty || {}),
};

const $ = (id) => document.getElementById(id);
const cm = (mm) => (Math.round(mm) / 10).toLocaleString("zh-TW", { maximumFractionDigits: 1 }) + " cm";
const fmt1 = (x) => (Math.round(x * 10) / 10).toString();
function profiles() { return DEFAULTS.map(p => Object.assign({}, p, { w: +(state.widths[p.id] ?? p.w) })); }
function usable() { return profiles().filter(p => state.thk === "all" || p.t === state.thk); }
function kerf() { return Math.max(0, +state.kerf || 0); }
function chip(p) { return `<span class="code" style="background:${COLORS[p.id]}">${p.id}</span>`; }

// 無限背包：在 cap（mm）內混搭，讓用掉的寬度最大＝剩最少。單位 0.1mm。
function bestMix(capMm, items) {
  const k = kerf();
  const cap = Math.floor(capMm * 10 + 1e-6);
  const its = items.map(p => ({ p, c: Math.round((p.w + k) * 10) })).filter(x => x.c > 0 && x.c <= cap);
  if (!its.length || cap <= 0) return { used: 0, counts: {} };
  const reach = new Int32Array(cap + 1).fill(-1); // 記最後放的是哪一款
  const pieces = new Int32Array(cap + 1).fill(1 << 30);
  reach[0] = -2; pieces[0] = 0;
  for (let s = 0; s <= cap; s++) {
    if (reach[s] === -1) continue;
    for (let i = 0; i < its.length; i++) {
      const n = s + its[i].c;
      if (n > cap) continue;
      if (reach[n] === -1 || pieces[s] + 1 < pieces[n]) { reach[n] = i; pieces[n] = pieces[s] + 1; }
    }
  }
  let best = cap; while (best > 0 && reach[best] === -1) best--;
  const counts = {}; let s = best;
  while (s > 0) { const i = reach[s]; counts[its[i].p.id] = (counts[its[i].p.id] || 0) + 1; s -= its[i].c; }
  return { used: best / 10, counts };
}

function mixText(mix, all) {
  const ids = Object.keys(mix.counts);
  if (!ids.length) return "放不下任何一款";
  return ids.sort().map(id => { const p = all.find(q => q.id === id); return `${chip(p)} ${p.name} × ${mix.counts[id]}`; }).join("　");
}

// ── 功能一 ──
function renderLeft() {
  const raw = +state.leftW || 0;
  const L = state.leftUnit === "cm" ? raw * 10 : raw;
  const k = kerf();
  const ps = usable();
  if (!(L > 0)) { $("leftOut").innerHTML = `<p class="muted">輸入剩料寬度。</p>`; return; }
  let h = `<p class="muted">剩料 ${fmt1(L)} mm（${cm(L)}）</p><table><tr><th>款</th><th>寬</th><th>可做</th></tr>`;
  ps.forEach(p => {
    const c = p.w + k; const n = Math.floor(L / c + 1e-9);
    const r = n > 0 ? `<span class="ok">${n} 支</span> <span class="muted">剩 ${cm(L - n * c)}</span>` : `<span class="bad">差 ${cm(c - L)}</span>`;
    h += `<tr><td>${chip(p)} ${p.name}</td><td>${cm(p.w)}</td><td>${r}</td></tr>`;
  });
  h += `</table>`;
  const groups = [...new Set(ps.map(p => p.t))];
  groups.forEach(t => {
    const g = ps.filter(p => p.t === t);
    const mix = bestMix(L, g);
    h += `<h3>最省搭法${groups.length > 1 ? `（剩料是 ${t}）` : ""}</h3><p>${mixText(mix, g)}</p><p class="big">最後剩 ${cm(L - mix.used)}</p>`;
  });
  $("leftOut").innerHTML = h;
}

// ── 功能二 ──
function renderQty() {
  let h = `<tr><th>款</th><th>寬</th><th>厚</th><th>支數</th></tr>`;
  profiles().forEach(p => {
    h += `<tr><td>${chip(p)} ${p.name}</td><td>${cm(p.w)}</td><td>${p.t}</td><td><input type="number" class="small" inputmode="numeric" min="0" data-q="${p.id}" value="${state.qty[p.id] || ""}"></td></tr>`;
  });
  $("qtyTable").innerHTML = h;
  $("qtyTable").querySelectorAll("input[data-q]").forEach(el => el.addEventListener("input", () => {
    state.qty[el.dataset.q] = Math.max(0, Math.floor(+el.value || 0)); save();
  }));
}

function runPack() {
  const W = +state.sheetW; const k = kerf();
  const all = profiles(); const ok = usable();
  const pieces = []; const skipped = [];
  all.forEach(p => {
    const n = state.qty[p.id] || 0; if (!n) return;
    if (!ok.some(q => q.id === p.id)) { skipped.push(`${chip(p)} ${p.name} × ${n}：厚度 ${p.t} 不符`); return; }
    if (p.w + k > W) { skipped.push(`${chip(p)} ${p.name} × ${n}：寬 ${cm(p.w)} 比板寬 ${cm(W)} 還寬`); return; }
    for (let i = 0; i < n; i++) pieces.push(p);
  });
  pieces.sort((a, b) => b.w - a.w);
  const sheets = [];
  pieces.forEach(p => {
    const c = p.w + k;
    let s = sheets.find(s => s.t === p.t && s.used + c <= W + 1e-9);
    if (!s) { s = { t: p.t, used: 0, items: [] }; sheets.push(s); }
    s.items.push(p); s.used += c;
  });
  sheets.sort((a, b) => a.t.localeCompare(b.t));
  let h = "";
  if (!pieces.length && !skipped.length) { $("packOut").innerHTML = `<p class="muted">先填每款要幾支。</p>`; return; }
  const byT = {}; sheets.forEach(s => byT[s.t] = (byT[s.t] || 0) + 1);
  h += `<p class="big">共 ${sheets.length} 張板</p><p class="muted">板寬 ${cm(W)}　` + Object.keys(byT).map(t => `${t} × ${byT[t]} 張`).join("　") + `</p>`;
  sheets.forEach((s, i) => {
    const rest = W - s.used;
    h += `<div class="sheet"><b>第 ${i + 1} 張（${s.t}）</b>　剩 <b>${cm(rest)}</b>`;
    h += `<div class="bar">` + s.items.map(p => `<div class="seg-piece" style="flex:0 0 ${((p.w + k) / W * 100).toFixed(3)}%;background:${COLORS[p.id]}"><b>${p.id}</b>${fmt1(p.w / 10)}</div>`).join("") + `</div>`;
    const cnt = {}; s.items.forEach(p => cnt[p.id] = (cnt[p.id] || 0) + 1);
    h += `<div>` + Object.keys(cnt).sort().map(id => { const p = all.find(q => q.id === id); return `<span class="pill">${chip(p)} ${p.name} × ${cnt[id]}</span>`; }).join("") + `</div>`;
    if (rest > 0) {
      const same = ok.filter(q => q.t === s.t);
      const mix = bestMix(rest, same);
      if (Object.keys(mix.counts).length) h += `<p class="muted">剩料還可以加做：${mixText(mix, same)}，加做完剩 ${cm(rest - mix.used)}</p>`;
      else h += `<p class="muted">剩料太窄，什麼都加做不了。</p>`;
    }
    const lens = new Set(s.items.map(p => p.len));
    if (lens.has("2100") && lens.size > 1) h += `<div class="note">這張有長 2100 的款跟其他長度混在一起，長度要另外確認。</div>`;
    h += `</div>`;
  });
  if (skipped.length) h += `<h3 class="bad">未排入</h3><ul>` + skipped.map(x => `<li>${x}</li>`).join("") + `</ul>`;
  h += `<div class="note">只比寬度。B、C 長 2100，跟 10 尺的款混在同一張時，長度要另外確認。</div>`;
  $("packOut").innerHTML = h;
}

// ── 板型資料 ──
function renderSpec() {
  let h = `<tr><th>款</th><th>厚</th><th>折型</th><th>展開寬 mm</th><th>長</th></tr>`;
  profiles().forEach(p => {
    h += `<tr><td>${chip(p)} ${p.name}</td><td>${p.t}</td><td class="muted">${p.folds}</td><td><input type="number" class="small" inputmode="decimal" min="1" data-w="${p.id}" value="${p.w}"><div class="muted">${cm(p.w)}</div></td><td>${p.len}</td></tr>`;
  });
  $("specTable").innerHTML = h;
  $("specTable").querySelectorAll("input[data-w]").forEach(el => el.addEventListener("change", () => {
    const v = +el.value; if (v > 0) state.widths[el.dataset.w] = v; else delete state.widths[el.dataset.w];
    save(); renderAll();
  }));
}

function renderTop() {
  $("sheetW").value = state.sheetW;
  $("sheetWcm").textContent = `＝ ${cm(+state.sheetW)}`;
  document.querySelectorAll("#wQuick button").forEach(b => b.classList.toggle("on", +b.dataset.w === +state.sheetW));
  document.querySelectorAll("#thk button").forEach(b => b.classList.toggle("on", b.dataset.t === state.thk));
  document.querySelectorAll("#leftUnit button").forEach(b => b.classList.toggle("on", b.dataset.u === state.leftUnit));
  $("kerf").value = state.kerf;
  $("leftW").value = state.leftW;
}
function renderAll() { renderTop(); renderLeft(); renderQty(); renderSpec(); if ($("packOut").innerHTML) runPack(); }

document.querySelectorAll("#wQuick button").forEach(b => b.addEventListener("click", () => { state.sheetW = +b.dataset.w; save(); renderAll(); }));
$("sheetW").addEventListener("change", () => { const v = +$("sheetW").value; if (v > 0) { state.sheetW = v; save(); renderAll(); } });
document.querySelectorAll("#thk button").forEach(b => b.addEventListener("click", () => { state.thk = b.dataset.t; save(); renderAll(); }));
$("kerf").addEventListener("input", () => { state.kerf = Math.max(0, +$("kerf").value || 0); save(); renderLeft(); if ($("packOut").innerHTML) runPack(); });
document.querySelectorAll("#leftUnit button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.u === state.leftUnit) return;
  const v = +state.leftW || 0;
  state.leftW = b.dataset.u === "mm" ? Math.round(v * 10 * 10) / 10 : Math.round(v / 10 * 100) / 100;
  state.leftUnit = b.dataset.u; save(); renderTop(); renderLeft();
}));
$("leftW").addEventListener("input", () => { state.leftW = +$("leftW").value || 0; save(); renderLeft(); });
$("runPack").addEventListener("click", runPack);
$("clearQty").addEventListener("click", () => { state.qty = {}; save(); renderQty(); $("packOut").innerHTML = ""; });
$("resetSpec").addEventListener("click", () => { state.widths = {}; save(); renderAll(); });

renderAll();
</script>
</body>
</html>
