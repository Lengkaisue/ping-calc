<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>佳能板型 混搭計算機</title>
<style>
  :root {
    --bg: #0f1114; --card: #1a1d23; --ink: #e6e8eb; --sub: #8b93a1; --line: #2c313a;
    --key: #262a32; --keyhi: #313742; --accent: #f5a524; --lcd: #0b1a10; --lcdink: #7dffa0;
    --warn: #ffb547; --warnbg: #2a2110; --ok: #6ee7a0; --bad: #ff7b72;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif; }
  header { background: #08090b; color: var(--accent); padding: 14px 16px; position: sticky; top: 0; z-index: 5; border-bottom: 2px solid var(--accent); }
  header h1 { margin: 0; font-size: 19px; letter-spacing: 1px; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 12px 60px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 6px rgba(0,0,0,.4); }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--accent); }
  h3 { font-size: 15px; margin: 14px 0 6px; color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  label.inl { display: flex; align-items: center; gap: 6px; }
  input[type=number] { width: 110px; font: 600 18px ui-monospace, "Consolas", monospace; padding: 8px; border: 1px solid #1f3a26; border-radius: 8px; background: var(--lcd); color: var(--lcdink); text-align: right; }
  input.small { width: 80px; }
  button { font-size: 15px; padding: 9px 12px; border-radius: 10px; border: 1px solid #3a404b; background: linear-gradient(#2e333c, var(--key)); color: var(--ink); cursor: pointer; min-height: 42px; box-shadow: 0 2px 0 #000; }
  button:active { transform: translateY(1px); box-shadow: none; }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .muted { color: var(--sub); font-size: 14px; }
  .note { background: var(--warnbg); color: var(--warn); border: 1px solid #4a3a14; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { color: var(--sub); font-weight: 600; font-size: 13px; }
  .code { display: inline-block; min-width: 26px; text-align: center; color: #fff; border-radius: 6px; padding: 1px 6px; font-weight: 700; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); }
  .big { font: 700 20px ui-monospace, "Consolas", monospace; color: var(--lcdink); background: var(--lcd); border: 1px solid #1f3a26; border-radius: 8px; padding: 8px 10px; display: inline-block; }
  .bar { display: flex; height: 56px; border: 2px solid #4a515c; border-radius: 6px; overflow: hidden; background: repeating-linear-gradient(45deg, #23272e, #23272e 6px, #1a1d22 6px, #1a1d22 12px); margin: 6px 0 4px; }
  .seg-piece { display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-size: 12px; line-height: 1.2; border-right: 1px solid rgba(0,0,0,.6); overflow: hidden; white-space: nowrap; }
  .seg-piece b { font-size: 14px; }
  .sheet { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; background: #262b33; margin: 2px 4px 2px 0; font-size: 14px; }
  details summary { cursor: pointer; font-weight: 600; padding: 4px 0; color: var(--accent); }
  .kits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kit { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 10px; min-height: 72px; }
  .kit small { color: var(--sub); font-size: 13px; }
  .kit.on small { color: #3a2a00; }
  .stepper { display: inline-flex; align-items: center; gap: 8px; }
  .stepper button { width: 46px; height: 46px; font-size: 22px; padding: 0; }
  .stepper b { min-width: 28px; text-align: center; font: 700 20px ui-monospace, "Consolas", monospace; color: var(--lcdink); }
  button:disabled { opacity: .3; cursor: not-allowed; }
</style>
</head>
<body>
<header><h1>佳能板型 混搭計算機</h1></header>
<main>

<section>
  <h2>① 要折的套件</h2>
  <div class="kits" id="kits"></div>
  <p class="muted" id="kitInfo"></p>
</section>

<section>
  <h2>② 要折幾支</h2>
  <div id="mainRow"></div>
  <div id="needOut"></div>
  <h3>餘料還可以做</h3>
  <div id="extras"></div>
  <div class="row" id="extraBtns"><button class="primary" id="autoMax">自動最大化</button><button id="clearExtra">清除加做</button></div>
  <div id="summary"></div>
</section>

<section>
  <details>
    <summary>整單排料（很多款一起排）</summary>
    <table id="qtyTable"></table>
    <div class="row"><button class="primary" id="runPack">排料</button><button id="clearQty">清空支數</button></div>
    <div id="packOut"></div>
  </details>
</section>

<section>
  <details>
    <summary>板型資料（展開寬度可改）</summary>
    <p class="muted">展開寬度＝各邊加總（mm）。改了會記在這支手機上。板子照圖面：3'＝914、4'＝1219、5'＝1524，7'＝2100、10'＝3050（mm）。</p>
    <table id="specTable"></table>
    <div class="row"><button id="resetSpec">恢復預設</button></div>
  </details>
</section>

</main>
<script>
// 板子照「佳能常叫板型」圖面：每款用哪種板是固定的
const SHEETS = {
  "3x7":  { label: "3'×7'",  w: 914,  l: 2100 },
  "4x10": { label: "4'×10'", w: 1219, l: 3050 },
  "5x10": { label: "5'×10'", w: 1524, l: 3050 },
};
const DEFAULTS = [
  { id: "A", name: "C槽",           t: "1t",   folds: "30+52+30",        w: 112, sheet: "4x10" },
  { id: "B", name: "連通套件（薄款）", t: "1t",   folds: "30+215+30",       w: 275, sheet: "3x7" },
  { id: "C", name: "連通套件（厚款）", t: "1.2t", folds: "40+215+40",       w: 295, sheet: "3x7" },
  { id: "D", name: "樓梯口套件",      t: "1t",   folds: "35+305+35",       w: 375, sheet: "4x10" },
  { id: "E", name: "大連通",          t: "1.2t", folds: "30+88+240+88+30", w: 476, sheet: "5x10" },
  { id: "F", name: "扣布",            t: "1t",   folds: "30+40+50+30",     w: 150, sheet: "4x10" },
];
const COLORS = { A: "#1f6feb", B: "#12855c", C: "#0b5d3f", D: "#c2410c", E: "#7c3aed", F: "#be185d" };
const LS = "sheetmix_v4";
const store = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } })();
const state = {
  widths: Object.assign({}, store.widths || {}),
  mainId: store.mainId || "D",
  mainN: store.mainN != null ? store.mainN : null,
  add: Array.isArray(store.add) ? store.add : [],
  qty: Object.assign({}, store.qty || {}),
};
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const cm = (mm) => (Math.round(mm) / 10).toLocaleString("zh-TW", { maximumFractionDigits: 1 }) + " cm";
const fmt1 = (x) => (Math.round(x * 10) / 10).toString();
function profiles() { return DEFAULTS.map(p => Object.assign({}, p, { w: +(state.widths[p.id] ?? p.w), len: SHEETS[p.sheet].l })); }
function sheetOf(p) { return SHEETS[p.sheet]; }
function sheetName(t, sh) { return `亜板 ${t} ${sh.label}（${cm(sh.w)} × ${cm(sh.l)}）`; }
function byId(id) { return profiles().find(p => p.id === id); }
// 液壓切斷，沒有刀損
function cost(p) { return p.w; }
function chip(p) { return `<span class="code" style="background:${COLORS[p.id]}">${p.id}</span>`; }

// 無限背包：cap（mm）內混搭，用掉最多＝剩最少；同剩料時支數少的優先。單位 0.1mm
function bestMix(capMm, items) {
  const cap = Math.floor(capMm * 10 + 1e-6);
  const its = items.map(p => ({ p, c: Math.round(cost(p) * 10) })).filter(x => x.c > 0 && x.c <= cap);
  if (!its.length || cap <= 0) return { used: 0, counts: {} };
  const last = new Int32Array(cap + 1).fill(-1), pcs = new Int32Array(cap + 1).fill(1 << 30);
  last[0] = -2; pcs[0] = 0;
  for (let s = 0; s <= cap; s++) {
    if (last[s] === -1) continue;
    for (let i = 0; i < its.length; i++) {
      const n = s + its[i].c; if (n > cap) continue;
      if (last[n] === -1 || pcs[s] + 1 < pcs[n]) { last[n] = i; pcs[n] = pcs[s] + 1; }
    }
  }
  let best = cap; while (best > 0 && last[best] === -1) best--;
  const counts = {}; let s = best;
  while (s > 0) { const i = last[s]; counts[its[i].p.id] = (counts[its[i].p.id] || 0) + 1; s -= its[i].c; }
  return { used: best / 10, counts };
}

// ── 主流程：要折 N 支 → 幾張板、每張剩多少、餘料還能做什麼 ──
function W() { return sheetOf(byId(state.mainId)).w; }
function perSheet() { return Math.max(0, Math.floor(W() / cost(byId(state.mainId)) + 1e-9)); }
// 能用同一張板：厚度不超過板厚（厚板可以折薄款，師傅要的），長度不超過板長（長板可以切短款）
function sameSheet(p, t, l) { return parseFloat(p.t) <= parseFloat(t) && p.len <= l; }
function sameT() { const m = byId(state.mainId); return profiles().filter(p => sameSheet(p, m.t, m.len)); }
// 每張板：先排滿主套件，最後一張放剩下的；加做的料記在哪一張
function layout() {
  const m = byId(state.mainId), per = perSheet(), Wd = W(), N = state.mainN;
  const sheets = [];
  if (per > 0) for (let left = N; left > 0; left -= per) sheets.push({ items: Array(Math.min(per, left)).fill(m.id), rest: Wd - Math.min(per, left) * cost(m) });
  state.add = state.add.filter(([i, id]) => {
    const sh = sheets[i], q = byId(id);
    if (!sh || sh.rest < cost(q) - 1e-9) return false;
    sh.items.push(id); sh.rest -= cost(q); return true;
  });
  return sheets;
}
// 加一支：放進「放得下且剩最少」的那張
function slotFor(sheets, q) {
  let best = -1;
  sheets.forEach((sh, i) => { if (sh.rest >= cost(q) - 1e-9 && (best < 0 || sh.rest < sheets[best].rest)) best = i; });
  return best;
}
function setN(n) { state.mainN = Math.max(1, Math.min(999, Math.floor(+n || 1))); state.add = []; save(); renderCut(); }

function renderKits() {
  $("kits").innerHTML = profiles().map(p => `<button class="kit${p.id === state.mainId ? " on" : ""}" data-k="${p.id}"><span>${chip(p)} ${p.name}</span><small>${p.t}・${sheetOf(p).label}・${cm(p.w)}</small></button>`).join("");
  $("kits").querySelectorAll("button[data-k]").forEach(b => b.addEventListener("click", () => {
    state.mainId = b.dataset.k; state.mainN = perSheet() || 1; state.add = []; save(); renderAll();
  }));
  const m = byId(state.mainId);
  $("kitInfo").innerHTML = `用板 <b>${sheetName(m.t, sheetOf(m))}</b>（自動帶入）<br>展開 ${m.folds}＝${cm(m.w)}　長 ${m.len}　一張最多 ${perSheet()} 支`;
}

function stepper(val, minusOk, plusOk, attr) {
  return `<span class="stepper"><button ${attr}="-" ${minusOk ? "" : "disabled"}>−</button><b>${val}</b><button ${attr}="+" ${plusOk ? "" : "disabled"}>＋</button></span>`;
}

function renderCut() {
  const m = byId(state.mainId), Wd = W(), per = perSheet();
  if (state.mainN == null) state.mainN = per || 1;
  $("mainRow").innerHTML = `<div class="row">${chip(m)} <b>${m.name}</b>　<span class="stepper"><button data-m="-" ${state.mainN > 1 ? "" : "disabled"}>−</button><input type="number" id="mainN" class="small" inputmode="numeric" min="1" value="${state.mainN}"><button data-m="+">＋</button></span> 支</div>`;
  $("mainRow").querySelectorAll("button[data-m]").forEach(b => b.addEventListener("click", () => setN(state.mainN + (b.dataset.m === "+" ? 1 : -1))));
  $("mainN").addEventListener("change", () => setN($("mainN").value));
  if (per === 0) { $("needOut").innerHTML = `<p class="bad">這款比板子還寬，做不出來。</p>`; $("extras").innerHTML = ""; $("summary").innerHTML = ""; $("extraBtns").style.display = "none"; return; }

  const sheets = layout();
  const totalRest = sheets.reduce((a, sh) => a + sh.rest, 0);
  let h = `<p>要 <span class="big">${sheets.length} 張板</span>　${sheetName(m.t, sheetOf(m))}</p>`;
  sheets.forEach((sh, i) => {
    h += `<div class="sheet"><b>第 ${i + 1} 張</b>　剩 <b>${cm(sh.rest)}</b>`;
    h += `<div class="bar">` + sh.items.map(id => { const q = byId(id); return `<div class="seg-piece" style="flex:0 0 ${(cost(q) / Wd * 100).toFixed(3)}%;background:${COLORS[id]}"><b>${id}</b>${fmt1(q.w / 10)}</div>`; }).join("") + `</div></div>`;
  });
  $("needOut").innerHTML = h;

  const cntAdd = {}; state.add.forEach(([, id]) => cntAdd[id] = (cntAdd[id] || 0) + 1);
  const list = sameT().filter(q => cntAdd[q.id] || slotFor(sheets, q) >= 0);
  $("extras").innerHTML = list.length ? `<table>${list.map(q => {
    const n = cntAdd[q.id] || 0, can = slotFor(sheets, q) >= 0;
    return `<tr><td>${chip(q)} ${q.name}${q.id === m.id ? "（多折）" : ""}<div class="muted">${cm(q.w)}${q.t !== m.t ? `　原本 ${q.t}，用 ${m.t} 折` : ""}${q.len < m.len ? `　長 ${q.len}（料頭剩 ${cm(m.len - q.len)}）` : ""}</div></td><td style="text-align:right">${stepper(n, n > 0, can, `data-x="${q.id}" data-d`)}</td></tr>`;
  }).join("")}</table>` : `<p class="muted">餘料太窄，什麼都做不了。</p>`;
  $("extraBtns").style.display = list.length ? "" : "none";
  $("extras").querySelectorAll("button[data-x]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.x;
    if (b.dataset.d === "+") { const i = slotFor(layout(), byId(id)); if (i >= 0) state.add.push([i, id]); }
    else { for (let k = state.add.length - 1; k >= 0; k--) if (state.add[k][1] === id) { state.add.splice(k, 1); break; } }
    save(); renderCut();
  }));

  const cnt = {}; sheets.forEach(sh => sh.items.forEach(id => cnt[id] = (cnt[id] || 0) + 1));
  let t = `<h3>合計</h3><div>` + Object.keys(cnt).sort().map(id => `<span class="pill">${chip(byId(id))} ${byId(id).name} × ${cnt[id]}</span>`).join("") + `</div>`;
  t += `<p>${sheets.length} 張板，餘料合計 <b>${cm(totalRest)}</b>（` + sheets.map((sh, i) => `第${i + 1}張 ${cm(sh.rest)}`).join("、") + `）</p>`;
  $("summary").innerHTML = t;
}

$("autoMax").addEventListener("click", () => {
  state.add = [];
  const sheets = layout(), items = sameT();
  sheets.forEach((sh, i) => { const mix = bestMix(sh.rest, items); Object.keys(mix.counts).forEach(id => { for (let k = 0; k < mix.counts[id]; k++) state.add.push([i, id]); }); });
  save(); renderCut();
});
$("clearExtra").addEventListener("click", () => { state.add = []; save(); renderCut(); });

// ── 整單排料 ──
function renderQty() {
  let h = `<tr><th>款</th><th>寬</th><th>用板</th><th>支數</th></tr>`;
  profiles().forEach(p => {
    h += `<tr><td>${chip(p)} ${p.name}</td><td>${cm(p.w)}</td><td>${p.t} ${sheetOf(p).label}</td><td><input type="number" class="small" inputmode="numeric" min="0" data-q="${p.id}" value="${state.qty[p.id] || ""}"></td></tr>`;
  });
  $("qtyTable").innerHTML = h;
  $("qtyTable").querySelectorAll("input[data-q]").forEach(el => el.addEventListener("input", () => {
    state.qty[el.dataset.q] = Math.max(0, Math.floor(+el.value || 0)); save();
  }));
}
function runPack() {
  const all = profiles();
  const pieces = [], skipped = [];
  all.forEach(p => {
    const n = state.qty[p.id] || 0; if (!n) return;
    if (cost(p) > sheetOf(p).w) { skipped.push(`${chip(p)} ${p.name} × ${n}：寬 ${cm(p.w)} 比板寬還寬`); return; }
    for (let i = 0; i < n; i++) pieces.push(p);
  });
  if (!pieces.length && !skipped.length) { $("packOut").innerHTML = `<p class="muted">先填每款要幾支。</p>`; return; }
  pieces.sort((a, b) => b.w - a.w);
  const sheets = [];
  pieces.forEach(p => {
    let s = sheets.find(s => s.t === p.t && s.sh.l === p.len && s.used + cost(p) <= s.sh.w + 1e-9);
    if (!s) { s = { t: p.t, sh: sheetOf(p), used: 0, items: [] }; sheets.push(s); }
    s.items.push(p); s.used += cost(p);
  });
  const key = (s) => `${s.t} ${s.sh.label}`;
  sheets.sort((a, b) => key(a).localeCompare(key(b)));
  const byK = {}; sheets.forEach(s => byK[key(s)] = (byK[key(s)] || 0) + 1);
  let h = `<p class="big">共 ${sheets.length} 張板</p><p class="muted">` + Object.keys(byK).map(k => `亜板 ${k} × ${byK[k]} 張`).join("　") + `</p>`;
  sheets.forEach((s, i) => {
    const r = s.sh.w - s.used;
    h += `<div class="sheet"><b>第 ${i + 1} 張（${s.t} ${s.sh.label}）</b>　剩 <b>${cm(r)}</b>`;
    h += `<div class="bar">` + s.items.map(p => `<div class="seg-piece" style="flex:0 0 ${(cost(p) / s.sh.w * 100).toFixed(3)}%;background:${COLORS[p.id]}"><b>${p.id}</b>${fmt1(p.w / 10)}</div>`).join("") + `</div>`;
    const cnt = {}; s.items.forEach(p => cnt[p.id] = (cnt[p.id] || 0) + 1);
    h += `<div>` + Object.keys(cnt).sort().map(id => `<span class="pill">${chip(byId(id))} ${byId(id).name} × ${cnt[id]}</span>`).join("") + `</div>`;
    const same = all.filter(q => sameSheet(q, s.t, s.sh.l)), mix = bestMix(r, same), ids = Object.keys(mix.counts);
    h += ids.length ? `<p class="muted">剩料還可以加做：${ids.sort().map(id => `${chip(byId(id))} ${byId(id).name} × ${mix.counts[id]}`).join("　")}，加做完剩 ${cm(r - mix.used)}</p>` : `<p class="muted">剩料太窄，什麼都加做不了。</p>`;
    h += `</div>`;
  });
  if (skipped.length) h += `<h3 class="bad">未排入</h3><ul>` + skipped.map(x => `<li>${x}</li>`).join("") + `</ul>`;
  h += `<div class="note">每款用圖面上的板；厚度、長度都不超過那張板的款才會放進同一張（厚板可以折薄款、長板可以切短款）。</div>`;
  $("packOut").innerHTML = h;
}
$("runPack").addEventListener("click", runPack);
$("clearQty").addEventListener("click", () => { state.qty = {}; save(); renderQty(); $("packOut").innerHTML = ""; });

// ── 板型資料 ──
function renderSpec() {
  let h = `<tr><th>款</th><th>用板</th><th>折型</th><th>展開寬 mm</th><th>長</th></tr>`;
  profiles().forEach(p => {
    h += `<tr><td>${chip(p)} ${p.name}</td><td>${p.t} ${sheetOf(p).label}</td><td class="muted">${p.folds}</td><td><input type="number" class="small" inputmode="decimal" min="1" data-w="${p.id}" value="${p.w}"><div class="muted">${cm(p.w)}</div></td><td>${p.len}</td></tr>`;
  });
  $("specTable").innerHTML = h;
  $("specTable").querySelectorAll("input[data-w]").forEach(el => el.addEventListener("change", () => {
    const v = +el.value; if (v > 0) state.widths[el.dataset.w] = v; else delete state.widths[el.dataset.w];
    save(); renderAll();
  }));
}

function renderAll() { renderKits(); renderCut(); renderQty(); renderSpec(); if ($("packOut").innerHTML) runPack(); }

$("resetSpec").addEventListener("click", () => { state.widths = {}; save(); renderAll(); });

renderAll();
</script>

</body>
</html>
